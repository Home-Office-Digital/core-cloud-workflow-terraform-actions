name: "Resolve ephemeral"
description: "Gate an ephemeral deploy (dev only, branch must have an open PR) and output that PR number."

# Runs once at the preconditions stage, before the fan-out, only when a deploy is
# ephemeral. It gates and resolves in one step because the open-PR check and the
# PR number come from the same lookup. The caller builds the per-leg workspace
# name (pr-<n>-<deployment>) from the number this outputs.

inputs:
  branch:
    description: "Branch being deployed. Its open PR is the ephemeral environment's lifecycle anchor."
    required: true
  environment:
    description: "Target environment for this deploy."
    required: true
  ephemeral-environment:
    description: "The environment ephemeral is allowed in — the tenant's feedback tier, whatever it is named. Rejects any other."
    required: false
    default: "dev"

outputs:
  pr-number:
    description: "The open PR number for the branch. The caller forms pr-<number>-<deployment> workspace names."
    value: ${{ steps.resolve.outputs.pr-number }}

runs:
  using: composite
  steps:
    - name: Resolve ephemeral PR
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ inputs.branch }}
        ENVIRONMENT: ${{ inputs.environment }}
        EPHEMERAL_ENVIRONMENT: ${{ inputs.ephemeral-environment }}
      run: |
        set -euo pipefail

        if [[ "${ENVIRONMENT}" != "${EPHEMERAL_ENVIRONMENT}" ]]; then
          echo "::error::ephemeral is allowed only in '${EPHEMERAL_ENVIRONMENT}'; got '${ENVIRONMENT}'."
          exit 1
        fi

        # The open PR is the lifecycle anchor: it bounds the environment's life and
        # lets cleanup reap the workspace when the PR closes. No PR, no ephemeral.
        pr="$(gh pr list --repo "${REPO}" --head "${BRANCH}" --state open \
          --json number --jq '.[0].number // ""')"
        if [[ -z "${pr}" ]]; then
          echo "::error::no open PR for branch '${BRANCH}'. Open one (a draft is fine) before an ephemeral deploy."
          exit 1
        fi

        echo "resolved ephemeral PR ${pr} for branch '${BRANCH}'."
        echo "pr-number=${pr}" >> "${GITHUB_OUTPUT}"
