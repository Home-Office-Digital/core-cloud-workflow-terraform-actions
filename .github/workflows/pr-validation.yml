name: Terraform PR Validation

# Reusable PR validation workflow: the Terraform quality chain, plan-only with
# the read-only Plan_Role, so a PR can never change resources. No apply step, no
# apply role.
#   once per run:      deployments.json validation, expansion, and discovery of
#                      the components/modules that have tests (`expand`)
#   once per run:      fmt and TFLint (`lint`), in parallel with `test` and `validate`
#   per component/module: terraform test (`test` matrix)
#   per leg:           init -> validate -> plan (`validate` matrix)
#
# Validates EVERY component on every PR rather than detecting which a PR touches:
# `expand` enumerates the components root and the `validate` matrix runs one
# leg per component. This surfaces knock-on effects of a shared-module change
# without computing a dependency graph.

on:
  workflow_call:
    inputs:
      aws-region:
        description: "AWS Region for the State Bucket and Resources"
        default: eu-west-2
        required: false
        type: string
      environment:
        description: >-
          Which environment's state each PR plan runs against (dev, test, or
          prod). Validation is plan-only with no gate; this only picks the state
          and backend to plan against, it does not deploy.
        required: false
        default: "dev"
        type: string
      terraform-version:
        description: >-
          Terraform version to use. S3-native state locking needs 1.10+. A
          component using newer syntax must override it (the POC caller passes
          '>= 1.15.0').
        required: false
        default: ">= 1.10.0"
        type: string
      deployments-file:
        description: >-
          Path to the committed deployments.json (relative to the repo root), keyed
          by "<component>/<env>/<deployment>". PR validation is plan-only, so it
          uses account_id, plan_role_name, and the state backend per leg;
          apply_role_name is unused.
        required: false
        type: string
        default: "source/terraform/deployments.json"
      pre-exec-script:
        description: "Optional shell script run before terraform init in every job that runs init (each Plan/Apply/Validate leg and cleanup job). Same as standard-pipeline's pre-exec-script. GITHUB_TOKEN, COMPONENT, DEPLOYMENT and ENVIRONMENT are set."
        required: false
        type: string
        default: ""
      tf-aws-tag-policy-compliance:
        description: "Optional AWS provider tag-policy compliance level: 'warning' or 'error'. Exported as TF_AWS_TAG_POLICY_COMPLIANCE on every leg that runs plan or apply. Same as standard-pipeline."
        required: false
        type: string
        default: ""
      runner:
        description: "Runner label for the jobs that run Terraform against real providers (plan, apply, PR validate legs, cleanup). Bookkeeping jobs stay on ubuntu-latest. Same as standard-pipeline's runner."
        required: false
        default: "ubuntu-latest"
        type: string
    secrets:
      github_app_client_id:
        description: "GitHub App client ID for private module sources, as in standard-pipeline."
        required: false
      github_app_private_key:
        description: "GitHub App private key for private module sources, as in standard-pipeline."
        required: false
      git_auth_token:
        description: "Token for private module sources, as in standard-pipeline."
        required: false
      sonar_host_url:
        description: "Ignored. SonarQube runs in the repository's own scan workflow; kept so existing callers don't fail."
        required: false
      sonar_token:
        description: "Ignored. SonarQube runs in the repository's own scan workflow; kept so existing callers don't fail."
        required: false
      DYNATRACE_ENVIRONMENT_ID:
        required: false
      DYNATRACE_PLATFORM_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  # Once-per-run checks, then enumerate every {component, deployment} pair into
  # the matrix the validate job fans out over and every directory with tests into
  # the matrix the test job fans out over. Both selectors are 'all' because
  # validation covers everything.
  expand:
    name: "Expand deployments"
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.expand.outputs.include }}
      test-targets: ${{ steps.test-targets.outputs.targets }}
    steps:
      # Fail fast on a typo; the provider would otherwise reject it per leg.
      - name: Validate tag-policy setting
        env:
          TAG_POLICY: ${{ inputs.tf-aws-tag-policy-compliance }}
        run: |
          case "$TAG_POLICY" in
            ""|warning|error) ;;
            *)
              echo "::error::tf-aws-tag-policy-compliance must be 'warning', 'error' or empty; got '$TAG_POLICY'."
              exit 1
              ;;
          esac
      - name: Checkout
        uses: actions/checkout@v4

      # Whole-file check on every PR: broken or inconsistent deployments.json
      # can't merge. Validates all entries, every environment, not just this run's.
      - name: Validate deployments.json
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/pipeline/validate-deployments@feature/add-new-terraform-workflows
        with:
          deployments-file: ${{ inputs.deployments-file }}

      - name: Expand deployments
        id: expand
        # Pinned to the feature branch until the POC merges to main.
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/pipeline/expand-deployments@feature/add-new-terraform-workflows
        with:
          component: all
          deployment: all
          environment: ${{ inputs.environment }}
          # Matches deploy.yml's behaviour for 'all' runs: components without this environment are skipped with a notice.
          missing-environment: skip

      # Every component and module that has Terraform tests.
      - name: Find test targets
        id: test-targets
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/pipeline/find-test-targets@feature/add-new-terraform-workflows
        with:
          include-modules: "true"

  # Code-quality checks (fmt, TFLint), once per run, in parallel with tests and
  # plans. The PR check fails if this job fails.
  lint:
    name: "Lint"
    needs: expand
    if: ${{ needs.expand.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Formats every component and module once, recursively.
      - name: Terraform Fmt
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/fmt@feature/add-new-terraform-workflows
        with:
          working-directory: source/terraform
          recursive: true
          terraform-version: ${{ inputs.terraform-version }}

      # Lints every component and module once.
      - name: TFLint
        uses: Home-Office-Digital/core-cloud-workflow-tflint-scan@268b840d0e48fa86be281a5727909655311f7af4 # 0.3.2
        with:
          working_directory: source/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # One leg per component/module that has tests. terraform test needs an
  # initialised directory, so this job runs Pre-exec (private modules) and an
  # init without a backend: tests don't touch real state or AWS.
  test:
    name: "Test ${{ matrix.target.name }}"
    needs: expand
    if: ${{ needs.expand.result == 'success' && needs.expand.outputs.test-targets != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.expand.outputs.test-targets) }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-exec
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/pipeline/pre-exec@feature/add-new-terraform-workflows
        with:
          github-app-client-id: ${{ secrets.github_app_client_id }}
          github-app-private-key: ${{ secrets.github_app_private_key }}
          git-auth-token: ${{ secrets.git_auth_token }}
          script: ${{ inputs.pre-exec-script }}
          component: ${{ matrix.target.name }}
          environment: ${{ inputs.environment }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Terraform Init (no backend)
        working-directory: ${{ matrix.target.dir }}
        run: terraform init -backend=false -input=false

      - name: Terraform Test
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/test@feature/add-new-terraform-workflows
        with:
          working-directory: ${{ matrix.target.dir }}

  validate:
    name: "Validate ${{ matrix.component }}/${{ matrix.deployment }}"
    needs: expand
    # Tests and plans run in parallel on a PR; this job does not wait for `test`.
    # The PR check still fails if any test job fails.
    if: ${{ needs.expand.result == 'success' }}
    runs-on: ${{ inputs.runner }}
    # No `environment:`: PR validation is plan-only and must never hit an approval
    # gate. One leg per pair; fail-fast: false so one leg's failure still lets the
    # others report their plan.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand.outputs.include) }}

    permissions:
      contents: read
      pull-requests: read
      id-token: write

    env:
      # Dynatrace provider credentials, as in standard-pipeline; empty when not passed.
      DYNATRACE_ENVIRONMENT_ID: ${{ secrets.DYNATRACE_ENVIRONMENT_ID }}
      DYNATRACE_PLATFORM_TOKEN: ${{ secrets.DYNATRACE_PLATFORM_TOKEN }}
      TF_AWS_TAG_POLICY_COMPLIANCE: ${{ inputs.tf-aws-tag-policy-compliance }}
      component-working-directory: source/terraform/components/${{ matrix.component }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resolve this leg's config from deployments.json by its full key. Plan-only,
      # so only account_id, plan_role_name, and the state backend are used.
      - name: Resolve leg config
        id: account
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/pipeline/resolve-account@feature/add-new-terraform-workflows
        with:
          deployments-file: ${{ inputs.deployments-file }}
          component: ${{ matrix.component }}
          environment: ${{ inputs.environment }}
          deployment: ${{ matrix.deployment }}

      - name: Pre-exec
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/pipeline/pre-exec@feature/add-new-terraform-workflows
        with:
          github-app-client-id: ${{ secrets.github_app_client_id }}
          github-app-private-key: ${{ secrets.github_app_private_key }}
          git-auth-token: ${{ secrets.git_auth_token }}
          script: ${{ inputs.pre-exec-script }}
          component: ${{ matrix.component }}
          deployment: ${{ matrix.deployment }}
          environment: ${{ inputs.environment }}

      - name: Terraform Init
        id: init
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/init@feature/add-new-terraform-workflows
        with:
          account_id: ${{ steps.account.outputs.account-id }}
          aws-region: ${{ inputs.aws-region }}
          github-environment: ${{ inputs.environment }}
          role-to-assume: ${{ steps.account.outputs.plan-role-name }}
          state-bucket: ${{ steps.account.outputs.state-bucket-name }}
          # S3-native locking; no DynamoDB table.
          state-encrypt: "true"
          state-use-lockfile: "true"
          # Same repo-prefixed key as the deploy workflow (from resolve-account),
          # so the PR plan reads the state the deploy writes and shows real drift.
          state-key: ${{ steps.account.outputs.state-key }}
          terraform-version: ${{ inputs.terraform-version }}
          working-directory: ${{ env.component-working-directory }}

      - name: Terraform Validate
        if: success() || failure()
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/validate@feature/add-new-terraform-workflows
        with:
          terraform-version: ${{ inputs.terraform-version }}
          working-directory: ${{ env.component-working-directory }}

      # Plan only, Plan_Role only. No apply step and no apply role, so validation
      # can never change resources.
      - name: Terraform Plan
        id: plan
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/plan@feature/add-new-terraform-workflows
        with:
          account_id: ${{ steps.account.outputs.account-id }}
          aws-region: ${{ inputs.aws-region }}
          github-environment: ${{ inputs.environment }}
          role-to-assume: ${{ steps.account.outputs.plan-role-name }}
          terraform-version: ${{ inputs.terraform-version }}
          # Per-leg tfvars, as in the deploy workflow.
          tfvars-file: environments/${{ inputs.environment }}/${{ matrix.deployment }}.tfvars
          working-directory: ${{ env.component-working-directory }}
          # Per-leg name so parallel legs don't all upload terraform-plan-file-<env>;
          # matches the deploy workflow's scheme. '_' joins the parts because names can contain hyphens.
          artifact-name: terraform-plan_${{ matrix.component }}_${{ matrix.deployment }}_${{ inputs.environment }}
