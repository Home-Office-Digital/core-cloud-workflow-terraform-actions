name: Terraform PR Validation

# Reusable PR validation workflow. Runs the Terraform quality chain
# (init -> fmt -> validate -> test -> plan) with NO apply step and only the
# least-privilege Plan_Role, so pull request validation can never change
# resources (Requirements 8.5, 10.2, 10.3, 10.4).
#
# Validate-all fan-out (Requirements 11.4, 11.5 as validate-all): instead of
# detecting which stacks a PR touches, this workflow validates EVERY stack on
# every PR. A `discover` job enumerates the immediate subdirectories of the
# stacks root (default `terraform/stacks`) and emits a JSON array; the
# `validate` job then runs as a matrix over all stacks. Validating every stack
# on every PR is simpler for the POC and surfaces knock-on changes / drift in
# shared modules immediately, rather than risking a missed consumer. There is
# deliberately no affected-stack detection and no helper script.

on:
  workflow_call:
    inputs:
      aws-region:
        description: "AWS Region for the State Bucket and Resources"
        default: eu-west-2
        required: false
        type: string
      fmt-recursive:
        description: "Whether to run terraform fmt recursively across subdirectories"
        required: false
        default: true
        type: boolean
      github-environment:
        description: "The name of your AWS environment. Create an environment secret called ACCOUNT_ID, also."
        required: false
        default: "placeholder"
        type: string
      stacks-dir:
        description: >-
          Root directory whose immediate subdirectories are the stacks to
          validate. The `discover` job enumerates `<stacks-dir>/*` and the
          `validate` matrix runs one leg per stack.
        required: false
        default: "terraform/stacks"
        type: string
      state-bucket:
        description: "Name of the S3 bucket for Terraform State"
        required: false
        type: string
      state-dynamodb-table:
        description: "Name of the DynamoDB table"
        required: false
        default: ""
        type: string
      state-key:
        description: "Where you want the state key to be"
        required: false
        type: string
        default: "terraform.tfstate"
      terraform-version:
        description: "Terraform version to use"
        required: false
        default: "~1.7.0"
        type: string
      working-directory:
        description: >-
          Deprecated. Retained for interface compatibility only. The validate
          matrix derives each leg's working directory from `stacks-dir` and the
          matrix stack (`<stacks-dir>/<stack>`), so this input is ignored.
        required: false
        default: "."
        type: string
    secrets:
      deployment-accounts:
        description: >-
          JSON object mapping a deployment to its AWS account ID, same format
          and lookup as the deploy workflow: "<stack>/<deployment>" first, then
          the bare "<deployment>" name as a fallback. Lets each validate leg
          plan against the account that actually owns its state, so a PR plan
          for a deployment in a non-default account reads the right state and
          reports real drift. Optional: if omitted, every leg falls back to the
          single `account_id` secret below.
        required: false
      account_id:
        description: >-
          Deprecated single-account fallback. Used by a validate leg only when
          `deployment-accounts` is absent or has no key for that leg. Prefer
          `deployment-accounts` so validation matches the deploy workflow's
          per-deployment account resolution.
        required: false
      role-to-assume:
        description: >-
          Role name (not ARN) for the read-only plan role. A secret rather than
          an input because a reusable workflow cannot read secrets context in a
          caller's `with:` block; the name itself is not sensitive. Omitting it
          leaves the plan role empty.
        required: false
      sonar_host_url:
        required: false
      sonar_token:
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # Enumerate every {stack, deployment} pair for this environment into a JSON
  # include-list the validate job fans out over. Validation always covers every
  # stack and every deployment, so both selectors default to 'all'. A stack+env
  # with several deployments (e.g. two under dev) yields one validate leg each.
  discover:
    name: "Discover deployments"
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.enumerate.outputs.include }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enumerate stack and deployment pairs
        id: enumerate
        # Pinned to the feature branch, not @main: new in this POC, not yet on main.
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/expand-deployments@feature/add-new-terraform-workflows
        with:
          stack: all
          deployment: all
          environment: ${{ inputs.github-environment }}
          stacks-dir: ${{ inputs.stacks-dir }}

  validate:
    name: "Terraform PR Validation (${{ matrix.stack }}/${{ matrix.deployment }})"
    needs: discover
    runs-on: ubuntu-latest
    # No `environment:` here: PR validation is plan-only and must never hit an
    # environment approval gate. The account_id and role come from repo-level
    # secrets passed by the caller, not environment-scoped secrets, so binding
    # to an environment would only add a spurious required-reviewers pause.

    # Validate every {stack, deployment} pair, one leg each. fail-fast: false so
    # one leg's failure does not cancel the others — every PR shows the full
    # plan/drift impact across all stacks and deployments.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.include) }}

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    env:
      stack-working-directory: ${{ inputs.stacks-dir }}/${{ matrix.stack }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Resolve this leg's account the same way the deploy workflow does, via
      # the shared composite action: <stack>/<deployment> first, then the bare
      # <deployment> name from deployment-accounts, then the single account_id
      # secret as a fallback so existing single-account callers keep working.
      - name: Resolve account id
        id: account
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/resolve-account@feature/add-new-terraform-workflows
        with:
          deployment-accounts: ${{ secrets.deployment-accounts }}
          account-id-fallback: ${{ secrets.account_id }}
          stack: ${{ matrix.stack }}
          deployment: ${{ matrix.deployment }}

      - name: Terraform Init
        id: init
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/init@main
        with:
          account_id: ${{ steps.account.outputs.account-id }}
          aws-region: ${{ inputs.aws-region }}
          github-environment: ${{ inputs.github-environment }}
          role-to-assume: ${{ secrets.role-to-assume }}
          state-bucket: ${{ inputs.state-bucket }}
          state-dynamodb-table: ${{ inputs.state-dynamodb-table }}
          # Key matches the deploy workflow's <stack>/<env>/<deployment> layout
          # so the PR plan reads the same state the deploy writes and shows real
          # drift. One leg per deployment, so each reads its own deployment state.
          state-key: ${{ matrix.stack }}/${{ inputs.github-environment }}/${{ matrix.deployment }}/terraform.tfstate
          terraform-version: ${{ inputs.terraform-version }}
          working-directory: ${{ env.stack-working-directory }}

      - name: Terraform Fmt
        if: success() || failure()
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/fmt@main
        with:
          # Fix: pass the configured working-directory. The legacy inline PR
          # validation left this empty on pull_request events (Requirement 10.4).
          working-directory: ${{ env.stack-working-directory }}
          recursive: ${{ inputs.fmt-recursive }}
          terraform-version: ${{ inputs.terraform-version }}

      - name: Terraform Validate
        if: success() || failure()
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/validate@main
        with:
          terraform-version: ${{ inputs.terraform-version }}
          working-directory: ${{ env.stack-working-directory }}

      - name: Terraform Test
        if: success() || failure()
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/test@main
        with:
          working-directory: ${{ env.stack-working-directory }}
          sonar-host-url: ${{ secrets.sonar_host_url }}
          sonar-token: ${{ secrets.sonar_token }}

      # Plan only — assumes the Plan_Role. There is deliberately NO apply step
      # and NO apply role, so PR validation can never change resources
      # (Requirements 8.5, 10.3).
      - name: Terraform Plan
        id: plan
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/plan@main
        with:
          account_id: ${{ steps.account.outputs.account-id }}
          aws-region: ${{ inputs.aws-region }}
          github-environment: ${{ inputs.github-environment }}
          role-to-assume: ${{ secrets.role-to-assume }}
          terraform-version: ${{ inputs.terraform-version }}
          # Per-leg tfvars, derived from the deployment, mirroring the deploy
          # workflow. Replaces the single `tfvars-file` caller input.
          tfvars-file: environments/${{ inputs.github-environment }}/${{ matrix.deployment }}.tfvars
          working-directory: ${{ env.stack-working-directory }}
