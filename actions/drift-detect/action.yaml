name: "Terraform Drift Detect"
description: "Detect infrastructure drift using Terraform plan and notify via Slack"

inputs:
  account_id:
    description: "AWS Account ID"
    required: true
  aws-region:
    description: "AWS Region for the State Bucket and Resources"
    default: eu-west-2
    required: false
    type: string
  github-environment:
    description: "The name of your AWS environment"
    required: false
    default: "placeholder"
    type: string
  role-to-assume:
    description: "AWS Role name for OIDC"
    required: true
    type: string
  state-bucket:
    description: "Name of the S3 bucket for Terraform State"
    required: true
    type: string
  state-dynamodb-table:
    description: "Name of the DynamoDB table"
    required: false
    default: ""
    type: string
  state-key:
    description: "Where you want the state key to be"
    required: false
    type: string
    default: "terraform.tfstate"
  terraform-version:
    description: "Terraform version to use"
    required: false
    default: "~1.7.0"
    type: string
  tfvars-file:
    description: "Optional path to a .tfvars file"
    required: false
    default: ""
    type: string
  working-directory:
    description: "Directory containing Terraform configuration"
    required: false
    default: "."
    type: string
  pre-exec-script:
    description: "Optional multiline shell script to run before Terraform steps"
    required: false
    default: ""
    type: string
  webhook-url:
    description: "Slack Incoming Webhook URL"
    required: true
    type: string

outputs:
  drift-detected:
    description: "Whether drift was detected (true/false)"
    value: ${{ steps.check-drift.outputs.drift-detected }}
  plan-exit-code:
    description: "Raw terraform plan exit code (0, 1, or 2)"
    value: ${{ steps.check-drift.outputs.plan-exit-code }}

runs:
  using: composite
  steps:
    - name: Run Optional Pre-Exec Commands
      if: ${{ inputs.pre-exec-script != '' }}
      shell: bash
      run: |
        eval "${{ inputs.pre-exec-script }}"

    - name: Terraform Init
      uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/init@main
      with:
        account_id: ${{ inputs.account_id }}
        aws-region: ${{ inputs.aws-region }}
        github-environment: ${{ inputs.github-environment }}
        role-to-assume: ${{ inputs.role-to-assume }}
        state-bucket: ${{ inputs.state-bucket }}
        state-dynamodb-table: ${{ inputs.state-dynamodb-table }}
        state-key: ${{ inputs.state-key }}
        terraform-version: ${{ inputs.terraform-version }}
        working-directory: ${{ inputs.working-directory }}
        use-backend: true

    - name: Validate tfvars file
      if: ${{ inputs.tfvars-file != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ ! -f "${{ inputs.tfvars-file }}" ]; then
          echo "::error::Variable file '${{ inputs.tfvars-file }}' not found"
          exit 1
        fi

    - name: Terraform Plan (Drift Detection)
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        if [ -n "${{ inputs.tfvars-file }}" ]; then
          terraform plan -detailed-exitcode -input=false -var-file="${{ inputs.tfvars-file }}"
        else
          terraform plan -detailed-exitcode -input=false
        fi
        EXIT_CODE=$?
        set -e

        echo "plan-exit-code=$EXIT_CODE" >> $GITHUB_OUTPUT

        if [ $EXIT_CODE -eq 0 ]; then
          echo "drift-detected=false" >> $GITHUB_OUTPUT
        elif [ $EXIT_CODE -eq 2 ]; then
          echo "drift-detected=true" >> $GITHUB_OUTPUT
        else
          echo "drift-detected=false" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Notify Slack
      if: always()
      uses: slackapi/slack-github-action@v2
      with:
        webhook: ${{ secrets.DRIFT_DETECTION_WEBHOOK_URL }}
        webhook-type: incoming-webhook
        payload: |
          {
            "text": "Drift check for ${{ github.repository }} (${{ inputs.github-environment }}): ${{ steps.plan.outputs.drift-detected == 'true' && '⚠️ Drift detected' || steps.plan.outputs.plan-exit-code == '0' && '✅ No drift' || '❌ Check failed' }} — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
          }

    - name: Write Step Summary
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.plan.outputs.plan-exit-code }}
        DRIFT_DETECTED: ${{ steps.plan.outputs.drift-detected }}
        ENVIRONMENT: ${{ inputs.github-environment }}
        WORKING_DIR: ${{ inputs.working-directory }}
      run: |
        REPO="${GITHUB_REPOSITORY}"
        if [ "$DRIFT_DETECTED" == "true" ]; then
          echo "## :warning: Drift Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | \`$REPO\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`$ENVIRONMENT\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Working Directory | \`$WORKING_DIR\` |" >> $GITHUB_STEP_SUMMARY
        elif [ "$EXIT_CODE" == "0" ]; then
          echo "## :white_check_mark: No Drift Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | \`$REPO\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`$ENVIRONMENT\` |" >> $GITHUB_STEP_SUMMARY
        else
          echo "## :x: Plan Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | \`$REPO\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`$ENVIRONMENT\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Working Directory | \`$WORKING_DIR\` |" >> $GITHUB_STEP_SUMMARY
        fi
