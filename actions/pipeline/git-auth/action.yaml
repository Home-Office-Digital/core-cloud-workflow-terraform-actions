name: "Git auth"
description: "Configure git to use a GitHub App token or git_auth_token for private module sources on github.com, before terraform init."
# With both GitHub App secrets, mints an App token; otherwise uses git-auth-token.
# With neither, does nothing. Git is pointed at the token for HTTPS and SSH
# github.com URLs, so `terraform init` can clone private git module sources.
#
# Set with GIT_CONFIG_COUNT/KEY/VALUE in $GITHUB_ENV, not `git config --global`,
# so the token lasts for this job only and is never written to ~/.gitconfig,
# where it could outlive the job on a self-hosted runner. Requires git 2.31+.
inputs:
  github-app-client-id:
    description: "GitHub App client ID. Set with github-app-private-key."
    required: false
    default: ""
  github-app-private-key:
    description: "GitHub App private key. Set with github-app-client-id."
    required: false
    default: ""
  git-auth-token:
    description: "Token used when no GitHub App is configured."
    required: false
    default: ""
runs:
  using: composite
  steps:
    # A half-configured App would otherwise fall back silently to another token.
    - name: Check private module secrets
      if: ${{ (inputs.github-app-client-id != '') != (inputs.github-app-private-key != '') }}
      shell: bash
      run: |
        echo "::error::github_app_client_id and github_app_private_key must be set together; only one is set."
        exit 1

    - name: Mint GitHub App token
      if: ${{ inputs.github-app-client-id != '' && inputs.github-app-private-key != '' }}
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.github-app-client-id }}
        private-key: ${{ inputs.github-app-private-key }}
        owner: Home-Office-Digital

    - name: Configure git for private modules
      if: ${{ steps.app-token.outputs.token != '' || inputs.git-auth-token != '' }}
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        CUSTOM_GITHUB_TOKEN: ${{ inputs.git-auth-token }}
      run: ${{ github.action_path }}/git-auth.sh
