name: Terraform Ephemeral Cleanup

# Destroys ephemeral pr-<n>-<deployment> workspaces.
#   scope=all     workspaces of closed or merged PRs
#   scope=pr-<n>  one PR's workspaces, in any state
# Ungated: it only touches pr-* workspaces in the development environment, so a
# scheduled run can go unattended.
on:
  workflow_call:
    inputs:
      scope:
        description: "'all' (closed/merged PRs) or 'pr-<n>' (one PR, any state)."
        required: true
        type: string
      environment:
        description: "The ephemeral environment to clean up. Must equal development-environment; any other value is rejected."
        required: true
        type: string
      development-environment:
        description: "Name of the environment that hosts ephemeral workspaces. Must match the development-environment passed to terraform-multi-env-deploy.yml."
        required: false
        type: string
        default: "development"
      aws-region:
        description: "AWS region for the state backend."
        required: false
        type: string
        default: "eu-west-2"
      terraform-version:
        description: "Terraform version to use. S3-native state locking needs 1.10+."
        required: false
        type: string
        default: ">= 1.10.0"
      terraform-dir:
        description: "Folder holding components/, modules/ and deployments.json, such as infra/prod. Checked by resolve-terraform-dir. Must match the deploy workflow's."
        required: false
        type: string
        default: "source/terraform"
      deployments-file:
        description: >-
          Path to deployments.json, keyed "<component>/<env>/<deployment>".
          Reads account_id, apply_role_name, state_bucket_name and, if set,
          state_lock_table_name.
          Defaults to <terraform-dir>/deployments.json.
        required: false
        type: string
        default: ""
      runner:
        description: "Runner label for the discover and destroy jobs. Same as standard-pipeline."
        required: false
        default: "ubuntu-latest"
        type: string
    secrets:
      github_app_client_id:
        description: "GitHub App client ID for private module sources. Set with github_app_private_key; the workflow mints a token and configures git for github.com."
        required: false
      github_app_private_key:
        description: "GitHub App private key for private module sources. Set with github_app_client_id."
        required: false
      git_auth_token:
        description: "Token for private module sources, used when no GitHub App is set. The workflow configures git for github.com with it."
        required: false
      DYNATRACE_ENVIRONMENT_ID:
        required: false
      DYNATRACE_PLATFORM_TOKEN:
        required: false

run-name: "cleanup ${{ inputs.scope }} in ${{ inputs.environment }}"

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  # Checks the environment before any AWS access, then lists what to destroy.
  discover:
    name: "Discover (${{ inputs.scope }})"
    runs-on: ${{ inputs.runner }}
    outputs:
      workspaces: ${{ steps.discover.outputs.workspaces }}
      state-prefix: ${{ steps.dir.outputs.state-prefix }}
      deployments-file: ${{ steps.dir.outputs.deployments-file }}
    steps:
      - name: Guard environment
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DEVELOPMENT_ENVIRONMENT: ${{ inputs.development-environment }}
        run: |
          if [[ -z "${DEVELOPMENT_ENVIRONMENT}" || "${ENVIRONMENT}" != "${DEVELOPMENT_ENVIRONMENT}" ]]; then
            echo "::error::cleanup runs only in the ephemeral environment '${DEVELOPMENT_ENVIRONMENT}'; got '${ENVIRONMENT}'. It never touches any other environment's state."
            exit 1
          fi

      - name: Resolve terraform-dir
        id: dir
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/pipeline/resolve-terraform-dir@1.4.0
        with:
          terraform-dir: ${{ inputs.terraform-dir }}
          deployments-file: ${{ inputs.deployments-file }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Git auth
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/pipeline/git-auth@1.4.0
        with:
          github-app-client-id: ${{ secrets.github_app_client_id }}
          github-app-private-key: ${{ secrets.github_app_private_key }}
          git-auth-token: ${{ secrets.git_auth_token }}

      # Authenticates per leg, because legs can be in different accounts.
      - name: Discover orphan workspaces
        id: discover
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/ephemeral/discover-orphan-workspaces@1.4.0
        with:
          scope: ${{ inputs.scope }}
          environment: ${{ inputs.environment }}
          components-dir: ${{ inputs.terraform-dir }}/components
          state-prefix: ${{ steps.dir.outputs.state-prefix }}
          deployments-file: ${{ steps.dir.outputs.deployments-file }}
          aws-region: ${{ inputs.aws-region }}

  # Destroys and deletes each listed workspace. Skipped when there are none.
  destroy:
    name: "Destroy (${{ inputs.scope }})"
    needs: discover
    if: ${{ needs.discover.outputs.workspaces != '' }}
    runs-on: ${{ inputs.runner }}
    concurrency:
      group: cleanup-ephemeral${{ inputs.terraform-dir != 'source/terraform' && format('_{0}', inputs.terraform-dir) || '' }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      # Dynatrace provider credentials; empty when not passed.
      DYNATRACE_ENVIRONMENT_ID: ${{ secrets.DYNATRACE_ENVIRONMENT_ID }}
      DYNATRACE_PLATFORM_TOKEN: ${{ secrets.DYNATRACE_PLATFORM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git auth
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/pipeline/git-auth@1.4.0
        with:
          github-app-client-id: ${{ secrets.github_app_client_id }}
          github-app-private-key: ${{ secrets.github_app_private_key }}
          git-auth-token: ${{ secrets.git_auth_token }}

      - name: Destroy workspaces
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/ephemeral/destroy-workspaces@1.4.0
        with:
          workspaces: ${{ needs.discover.outputs.workspaces }}
          components-dir: ${{ inputs.terraform-dir }}/components
          state-prefix: ${{ needs.discover.outputs.state-prefix }}
          deployments-file: ${{ needs.discover.outputs.deployments-file }}
          environment: ${{ inputs.environment }}
          aws-region: ${{ inputs.aws-region }}
          terraform-version: ${{ inputs.terraform-version }}
