name: "Pre-exec"
description: "Mint a GitHub App token (or use a supplied token) and run the caller's pre-exec script before terraform init, mirroring standard-pipeline.yml."
# Mirrors standard-pipeline's "Use github appid and key" and "Run Optional
# Pre-Exec Commands" steps. The script is the caller's own code and runs once per
# job. `git config --global` changes made by the script persist for later steps in
# the same job only.
inputs:
  github-app-client-id:
    description: "GitHub App client ID used to mint a token."
    required: false
    default: ""
  github-app-private-key:
    description: "GitHub App private key used to mint a token."
    required: false
    default: ""
  git-auth-token:
    description: "Fallback token used when no GitHub App token is minted."
    required: false
    default: ""
  script:
    description: "Pre-exec script to run. Skipped when empty."
    required: false
    default: ""
  component:
    description: "Component name, exported to the script as COMPONENT."
    required: false
    default: ""
  deployment:
    description: "Deployment name, exported to the script as DEPLOYMENT."
    required: false
    default: ""
  environment:
    description: "Environment name, exported to the script as ENVIRONMENT."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Mint GitHub App token
      if: ${{ inputs.github-app-client-id != '' && inputs.github-app-private-key != '' }}
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.github-app-client-id }}
        private-key: ${{ inputs.github-app-private-key }}
        owner: Home-Office-Digital

    - name: Run pre-exec script
      if: ${{ inputs.script != '' }}
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
        CUSTOM_GITHUB_TOKEN: ${{ inputs.git-auth-token }}
        GITHUB_TOKEN: ${{ github.token }}
        PRE_EXEC_SCRIPT: ${{ inputs.script }}
        COMPONENT: ${{ inputs.component }}
        DEPLOYMENT: ${{ inputs.deployment }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [ -n "$APP_TOKEN" ]; then
          GITHUB_TOKEN="$APP_TOKEN"
        elif [ -n "$CUSTOM_GITHUB_TOKEN" ]; then
          GITHUB_TOKEN="$CUSTOM_GITHUB_TOKEN"
        fi
        echo "::add-mask::$GITHUB_TOKEN"
        export GITHUB_TOKEN COMPONENT DEPLOYMENT ENVIRONMENT
        eval "$PRE_EXEC_SCRIPT"
