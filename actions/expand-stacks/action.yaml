name: "Expand stacks"
description: "Resolve a stack selector into a JSON array of stack names for a matrix."

inputs:
  stack:
    description: >-
      A single name, a comma-separated list, or 'all' to enumerate every
      subdirectory of stacks-dir. 'all' is reserved: a directory literally
      named 'all' cannot be selected by name.
    required: false
    default: "all"
  stacks-dir:
    description: "Directory whose immediate subdirectories are the stacks. Used when stack is 'all'."
    required: false
    default: "terraform/stacks"

outputs:
  stacks:
    description: "JSON array of stack names, e.g. [\"stack-a\",\"stack-b\"]."
    value: ${{ steps.expand.outputs.stacks }}

runs:
  using: "composite"
  steps:
    - name: Expand stack input to JSON array
      id: expand
      shell: bash
      env:
        STACK_INPUT: ${{ inputs.stack }}
        STACKS_DIR: ${{ inputs.stacks-dir }}
      run: |
        set -euo pipefail

        if [[ "${STACK_INPUT}" == "all" ]]; then
          if [[ ! -d "${STACKS_DIR}" ]]; then
            echo "::error::stack=all but stacks directory '${STACKS_DIR}' was not found."
            exit 1
          fi
          mapfile -t names < <(find "${STACKS_DIR}" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [[ "${#names[@]}" -eq 0 ]]; then
            echo "::error::stack=all but no stacks were found under '${STACKS_DIR}'."
            exit 1
          fi
        else
          # Split on commas; trim whitespace; drop empties; dedupe keeping order.
          IFS=',' read -ra raw <<< "${STACK_INPUT}"
          names=()
          declare -A seen=()
          for item in "${raw[@]}"; do
            trimmed="${item#"${item%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
            [[ -z "${trimmed}" ]] && continue
            [[ -n "${seen[${trimmed}]:-}" ]] && continue
            seen[${trimmed}]=1
            names+=("${trimmed}")
          done
          if [[ "${#names[@]}" -eq 0 ]]; then
            echo "::error::stack input '${STACK_INPUT}' expanded to no stacks."
            exit 1
          fi
        fi

        json="$(printf '%s\n' "${names[@]}" | jq -R . | jq -cs .)"
        echo "Expanded stack input '${STACK_INPUT}' to ${json}"
        echo "stacks=${json}" >> "${GITHUB_OUTPUT}"
