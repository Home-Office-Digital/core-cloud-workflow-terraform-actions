name: "Deploy summary"
description: "Write a readable deploy-run summary (trigger, environment, version, mode, deployments) to the job summary."
# The rendering logic lives in deploy-summary.sh. Every input reaches the script
# through env:, never through interpolation into the script text. All inputs are
# optional so the summary can still be written when preflight stopped early.
inputs:
  mode:
    description: "Resolved mode: dispatch, push or release."
    required: false
    default: ""
  skip:
    description: "'true' when the run does nothing."
    required: false
    default: ""
  environment:
    description: "Resolved target environment."
    required: false
    default: ""
  version:
    description: "Resolved version (branch, tag or commit SHA)."
    required: false
    default: ""
  ephemeral:
    description: "'true' or 'false'."
    required: false
    default: ""
  pr-number:
    description: "Open PR number for an ephemeral run."
    required: false
    default: ""
  plan-only:
    description: "'true' when the run plans without applying."
    required: false
    default: ""
  include:
    description: "JSON array of {component, deployment} objects."
    required: false
    default: ""
  skipped:
    description: "JSON array of component names skipped for lacking the environment."
    required: false
    default: ""
  job-status:
    description: "Status of the calling job (success, failure, cancelled)."
    required: false
    default: ""
  event-name:
    description: "Name of the triggering event."
    required: false
    default: ""
  event-action:
    description: "Action of the triggering event, if any."
    required: false
    default: ""
  prerelease:
    description: "'true' when the release event is a pre-release."
    required: false
    default: ""
  ref-name:
    description: "Ref name that triggered the run."
    required: false
    default: ""
  actor:
    description: "User who triggered the run."
    required: false
    default: ""
  server-url:
    description: "GitHub server URL, used for links."
    required: false
    default: ""
  repository:
    description: "Repository as owner/name, used for links."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Write summary
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        SKIP: ${{ inputs.skip }}
        ENVIRONMENT: ${{ inputs.environment }}
        VERSION: ${{ inputs.version }}
        EPHEMERAL: ${{ inputs.ephemeral }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PLAN_ONLY: ${{ inputs.plan-only }}
        INCLUDE: ${{ inputs.include }}
        SKIPPED: ${{ inputs.skipped }}
        JOB_STATUS: ${{ inputs.job-status }}
        EVENT_NAME: ${{ inputs.event-name }}
        EVENT_ACTION: ${{ inputs.event-action }}
        PRERELEASE: ${{ inputs.prerelease }}
        REF_NAME: ${{ inputs.ref-name }}
        ACTOR: ${{ inputs.actor }}
        SERVER_URL: ${{ inputs.server-url }}
        REPOSITORY: ${{ inputs.repository }}
      run: ${{ github.action_path }}/deploy-summary.sh
