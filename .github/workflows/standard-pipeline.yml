name: Standard Terraform Pipeline

on:
  workflow_call:
    inputs:
      apply-branch:
        description: "Adds the ability to define which branch you want to be able to apply to"
        required: false
        default: "main"
        type: string
      apply-reviewed-plan:
        description: >-
          Apply the plan reviewed on the pull request rather than one generated at apply
          time. When true the plan artefact name gains the pull request head SHA, and the
          apply moves from `push` to the merge itself: the caller must trigger on
          `pull_request` with `types: [closed]`, and the apply runs when that pull request
          merged into apply-branch. A push to apply-branch then does NOT apply, because a
          commit that arrived without a pull request has no reviewed plan to apply.
          Requires the plan_artifact_token secret, which needs actions:read. Defaults
          false, which leaves artefact naming and the same-run apply on push exactly as
          they are today.
        required: false
        default: false
        type: boolean
      artifact-name:
        description: "Name of the plan artifact. Defaults to terraform-plan-file-<github-environment>. Set this to include a component element when a repository has more than one Terraform root."
        required: false
        default: ""
        type: string
      aws-region:
        description: "AWS Region for the State Bucket and Resources"
        default: eu-west-2
        required: false
        type: string
      fmt-recursive:
        description: "Whether to run terraform fmt recursively across subdirectories"
        required: false
        default: true
        type: boolean
      github-environment:
        description: "The name of your AWS environment. Create an environment secret called ACCOUNT_ID, also."
        required: false
        default: "placeholder"
        type: string
      plan-run-id:
        description: "Workflow run ID to download the plan artifact from. Leave unset to apply the plan produced by this run, which is the default behaviour. Requires the plan_artifact_token secret when set."
        required: false
        default: ""
        type: string
      retention-days:
        description: "Days to retain the plan artifact. Raise this when the apply runs in a later workflow run than the plan."
        required: false
        default: "1"
        type: string
      role-to-assume:
        description: "AWS Role name for OIDC"
        required: false
        type: string
      state-bucket:
        description: "Name of the S3 bucket for Terraform State"
        required: false
        type: string
      state-dynamodb-table:
        description: "Name of the DynamoDB table"
        required: false
        default: ""
        type: string
      state-encrypt:
        description: "Whether to pass encrypt to the S3 backend as -backend-config. Accepts 'true' or 'false'. Leave unset to omit the argument entirely, which is the existing behaviour."
        required: false
        default: ""
        type: string
      state-key:
        description: "Where you want the state key to be"
        required: false
        type: string
        default: "terraform.tfstate"
      state-use-lockfile:
        description: "Whether to pass use_lockfile to the S3 backend as -backend-config, which enables S3 native state locking. Accepts 'true' or 'false'. Leave unset to omit the argument entirely, which is the existing behaviour."
        required: false
        default: ""
        type: string
      terraform-version:
        description: "Terraform version to use"
        required: false
        default: "~1.7.0"
        type: string
      pre-exec-script:
        description: "Optional multiline shell script to run before Terraform steps"
        required: false
        default: ""
        type: string
      tf-aws-tag-policy-compliance:
        description: "Optional value for TF_AWS_TAG_POLICY_COMPLIANCE env var"
        required: false
        default: ""
        type: string
      tfvars-file:
        required: false
        type: string
        default: ""
      use-backend:
        description: "Whether to use a remote backend for Terraform state"
        required: false
        default: true
        type: boolean
      working-directory:
        description: "Directory containing main.tf"
        required: false
        default: "."
        type: string
    secrets:
      account_id:
        required: false
      git_auth_token:
        required: false
      sonar_host_url:
        required: false
      sonar_token:
        required: false
      github_app_client_id:
        required: false
      github_app_private_key:
        required: false
      plan_artifact_token:
        description: "Token used to read the plan artifact from another workflow run. Only needed when plan-run-id is set, and needs actions:read on this repository."
        required: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform-standardised-pipeline:
    name: "Terraform Standardised Pipeline"
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    env:
      TF_AWS_TAG_POLICY_COMPLIANCE: ${{ inputs.tf-aws-tag-policy-compliance }}
      INPUT_PRE_EXEC_SCRIPT: ${{ inputs.pre-exec-script }}
      GITHUB_APP_CLIENT_ID: ${{ secrets.github_app_client_id }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.github_app_private_key }}

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    outputs:
      result: ${{ steps.quality-checks.outcome }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # On a pull_request `closed` event the default ref is refs/pull/N/merge, and
          # GitHub deletes that ref when the pull request closes — checked against this
          # organisation: a merged pull request keeps refs/pull/N/head and has no
          # refs/pull/N/merge, and neither does one closed unmerged. The default checkout
          # would be fetching a ref that is being deleted underneath it. Pinning to the
          # head SHA uses the ref that survives, and gives init the tree the reviewed plan
          # was produced from. Empty on every other path, and `ref` has no default — the
          # action cannot tell an empty input from an absent one — so this is a no-op for
          # every existing caller.
          ref: >-
            ${{ (inputs.apply-reviewed-plan && github.event_name == 'pull_request'
            && github.event.action == 'closed' && github.event.pull_request.merged)
            && github.event.pull_request.head.sha || '' }}

      - name: Use github appid and key
        if: ${{ env.GITHUB_APP_CLIENT_ID != '' && env.GITHUB_APP_PRIVATE_KEY != '' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: Home-Office-Digital

      - name: Run Optional Pre-Exec Commands
        shell: bash
        env:
          CUSTOM_GITHUB_TOKEN: ${{ secrets.git_auth_token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            export GITHUB_TOKEN="$APP_TOKEN"
          elif [ -n "$CUSTOM_GITHUB_TOKEN" ]; then
            export GITHUB_TOKEN="$CUSTOM_GITHUB_TOKEN"
          fi
          if [ -n "$INPUT_PRE_EXEC_SCRIPT" ]; then
            eval "$INPUT_PRE_EXEC_SCRIPT"
          fi

      - name: Terraform Init
        id: init
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/init@main
        with:
          account_id: ${{ secrets.ACCOUNT_ID }}
          aws-region: ${{ inputs.aws-region }}
          github-environment: ${{ inputs.github-environment }}
          role-to-assume: ${{ inputs.role-to-assume }}
          state-bucket: ${{ inputs.state-bucket }}
          state-dynamodb-table: ${{ inputs.state-dynamodb-table }}
          state-encrypt: ${{ inputs.state-encrypt }}
          state-key: ${{ inputs.state-key }}
          state-use-lockfile: ${{ inputs.state-use-lockfile }}
          terraform-version: ${{ inputs.terraform-version }}
          working-directory: ${{ inputs.working-directory }}
          use-backend: ${{ inputs.use-backend }}

      - name: Terraform Fmt
        id: quality-checks
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/fmt@main
        with:
          working-directory: ${{ inputs.working-directory }}
          recursive: ${{ inputs.fmt-recursive }}

      - name: Terraform Validate
        if: success() || failure()
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/validate@main
        with:
          terraform-version: ${{ inputs.terraform-version }}
          working-directory: ${{ inputs.working-directory }}

      # TODO: TFLint is not part of the official terraform CLI and is more complex. Suggest keeping that in separate repo and pointing to it here, with the ability to disable
      - name: TFLint
        if: success() || failure()
        uses: Home-Office-Digital/core-cloud-workflow-tflint-scan@main
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Terraform Test
        if: success() || failure()
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/test@main
        with:
          working-directory: ${{ inputs.working-directory }}
          sonar-host-url: ${{ secrets.sonar_host_url }}
          sonar-token: ${{ secrets.sonar_token }}

      # Not when a pull request closes and a reviewed plan is being resolved. That run
      # shares the pull request's head SHA, so a plan uploaded here would carry the same
      # artefact name as the reviewed one and could be resolved in its place — a plan
      # generated after review, applied as though it were the reviewed one. resolve-plan
      # also refuses to resolve to its own run, so this is the first of two independent
      # guards. Keyed on `closed` rather than on `merged`, because planning as a pull
      # request closes has no value either way and the looser condition leaves no gap.
      - name: Terraform Plan
        if: >-
          ${{ inputs.use-backend == true
          && !(inputs.apply-reviewed-plan && github.event_name == 'pull_request'
          && github.event.action == 'closed') }}
        id: plan
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/plan@main
        with:
          account_id: ${{ secrets.ACCOUNT_ID }}
          # With apply-reviewed-plan the name gains the pull request head SHA so a later
          # apply can resolve it. The consumer never supplies the SHA: it is unavailable
          # on a push, which is why the pipeline owns the naming on both paths.
          artifact-name: ${{ inputs.apply-reviewed-plan && format('{0}-{1}', inputs.artifact-name != '' && inputs.artifact-name || format('terraform-plan-file-{0}', inputs.github-environment), github.event.pull_request.head.sha || github.sha) || inputs.artifact-name != '' && inputs.artifact-name || format('terraform-plan-file-{0}', inputs.github-environment) }}
          aws-region: ${{ inputs.aws-region }}
          github-environment: ${{ inputs.github-environment }}
          retention-days: ${{ inputs.retention-days }}
          role-to-assume: ${{ inputs.role-to-assume }}
          terraform-version: ${{ inputs.terraform-version }}
          tfvars-file: ${{ inputs.tfvars-file }}
          working-directory: ${{ inputs.working-directory }}

      # Finds the plan run for the pull request's head commit and the artefact in it. Only
      # when asked for, and only on the merge of a pull request into apply-branch — the
      # event whose payload carries the head SHA, which is why no merge-commit archaeology
      # is needed. On failure it fails with no outputs, so the apply below is skipped rather
      # than falling back to the fresh plan this feature exists to stop applying.
      - name: Resolve Reviewed Plan
        if: >-
          ${{ inputs.use-backend == true && inputs.apply-reviewed-plan
          && github.event_name == 'pull_request' && github.event.action == 'closed'
          && github.event.pull_request.merged
          && github.event.pull_request.base.ref == inputs.apply-branch }}
        id: resolve-plan
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/resolve-plan@main
        with:
          artefact-name-prefix: ${{ inputs.artifact-name != '' && inputs.artifact-name || format('terraform-plan-file-{0}', inputs.github-environment) }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          # This job's permissions are contents / pull-requests / id-token, so its own
          # GITHUB_TOKEN cannot read another run's artefacts. The same secret actions/apply
          # already uses for the cross-run download serves here.
          github-token: ${{ secrets.plan_artifact_token }}

      # Two mutually exclusive paths. Opted in, the apply happens on the merge, so a direct
      # push to apply-branch applies nothing — it has no reviewed plan, and silently
      # applying a fresh one is the behaviour this removes. Not opted in, this is the
      # existing push gate unchanged.
      - name: Terraform Apply
        if: >-
          ${{ inputs.use-backend == true
          && ((inputs.apply-reviewed-plan && github.event_name == 'pull_request'
          && github.event.action == 'closed' && github.event.pull_request.merged
          && github.event.pull_request.base.ref == inputs.apply-branch)
          || (!inputs.apply-reviewed-plan && github.ref_name == inputs.apply-branch)) }}
        id: apply
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/apply@main
        with:
          apply-branch: ${{ inputs.apply-branch }}
          account_id: ${{ secrets.ACCOUNT_ID }}
          # A resolved name and run id win; otherwise this is byte-for-byte as before, so a
          # caller that resolves plan-run-id for itself keeps working unchanged.
          artifact-name: ${{ steps.resolve-plan.outputs.artefact-name != '' && steps.resolve-plan.outputs.artefact-name || inputs.apply-reviewed-plan && format('{0}-{1}', inputs.artifact-name != '' && inputs.artifact-name || format('terraform-plan-file-{0}', inputs.github-environment), github.event.pull_request.head.sha || github.sha) || inputs.artifact-name != '' && inputs.artifact-name || format('terraform-plan-file-{0}', inputs.github-environment) }}
          aws-region: ${{ inputs.aws-region }}
          github-environment: ${{ inputs.github-environment }}
          github-token: ${{ secrets.plan_artifact_token }}
          plan-run-id: ${{ steps.resolve-plan.outputs.plan-run-id != '' && steps.resolve-plan.outputs.plan-run-id || inputs.plan-run-id }}
          role-to-assume: ${{ inputs.role-to-assume }}
          # This job always runs actions/init before the apply, so the apply must not
          # run its own init on the default path. These reach the action only on the
          # cross-run path, where the plan being applied was not produced by this run.
          state-bucket: ${{ (steps.resolve-plan.outputs.plan-run-id != '' && steps.resolve-plan.outputs.plan-run-id || inputs.plan-run-id) != '' && inputs.state-bucket || '' }}
          state-dynamodb-table: ${{ (steps.resolve-plan.outputs.plan-run-id != '' && steps.resolve-plan.outputs.plan-run-id || inputs.plan-run-id) != '' && inputs.state-dynamodb-table || '' }}
          state-encrypt: ${{ (steps.resolve-plan.outputs.plan-run-id != '' && steps.resolve-plan.outputs.plan-run-id || inputs.plan-run-id) != '' && inputs.state-encrypt || '' }}
          state-key: ${{ (steps.resolve-plan.outputs.plan-run-id != '' && steps.resolve-plan.outputs.plan-run-id || inputs.plan-run-id) != '' && inputs.state-key || '' }}
          state-use-lockfile: ${{ (steps.resolve-plan.outputs.plan-run-id != '' && steps.resolve-plan.outputs.plan-run-id || inputs.plan-run-id) != '' && inputs.state-use-lockfile || '' }}
          terraform-version: ${{ inputs.terraform-version }}
          working-directory: ${{ inputs.working-directory }}
