name: Terraform Ephemeral Cleanup

# Tears down ephemeral pr-<n>-<deployment> workspaces.
#   scope=all     closed/merged PRs only
#   scope=pr-<n>  one PR, any state
# Ungated: discover only lists pr-* workspaces and the guard confines it to dev,
# so it reaches no shared or prod state. A scheduled scope=all caller runs unattended.
on:
  workflow_call:
    inputs:
      scope:
        description: "'all' (closed/merged PRs) or 'pr-<n>' (one PR, any state)."
        required: true
        type: string
      environment:
        description: "The ephemeral environment to clean up. Must be 'dev'; any other value is rejected."
        required: true
        type: string
      aws-region:
        description: "AWS region for the state backend."
        required: false
        type: string
        default: "eu-west-2"
      terraform-version:
        description: "Terraform version to use."
        required: false
        type: string
        default: "~1.7.0"
      deployments-file:
        description: >-
          Path to the committed deployments.json (relative to the repo root), keyed
          by "<component>/<env>/<deployment>". Cleanup reads account_id,
          apply_role_name, and the state backend per leg.
        required: false
        type: string
        default: "source/terraform/deployments.json"

run-name: "cleanup ${{ inputs.scope }} in ${{ inputs.environment }}"

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  # Guards the environment before any AWS access, then lists the pr-* workspaces
  # to destroy.
  discover:
    name: "Discover (${{ inputs.scope }})"
    runs-on: ubuntu-latest
    outputs:
      workspaces: ${{ steps.discover.outputs.workspaces }}
    steps:
      - name: Guard environment
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ "${ENVIRONMENT}" != "dev" ]]; then
            echo "::error::cleanup runs only in 'dev'; got '${ENVIRONMENT}'. It never touches shared or prod state."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      # No Configure AWS credentials step: deployments may span accounts, so the
      # action authenticates per leg into each leg's own account (see its header).
      - name: Discover orphan workspaces
        id: discover
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/ephemeral/discover-orphan-workspaces@feature/add-new-terraform-workflows
        with:
          scope: ${{ inputs.scope }}
          environment: ${{ inputs.environment }}
          deployments-file: ${{ inputs.deployments-file }}
          aws-region: ${{ inputs.aws-region }}

  # Loops destroy + delete over the workspaces discover listed, re-assuming each
  # leg's account. Skips when none are in scope.
  destroy:
    name: "Destroy (${{ inputs.scope }})"
    needs: discover
    if: ${{ needs.discover.outputs.workspaces != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: cleanup-ephemeral-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Destroy workspaces
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/ephemeral/destroy-workspaces@feature/add-new-terraform-workflows
        with:
          workspaces: ${{ needs.discover.outputs.workspaces }}
          deployments-file: ${{ inputs.deployments-file }}
          environment: ${{ inputs.environment }}
          aws-region: ${{ inputs.aws-region }}
          terraform-version: ${{ inputs.terraform-version }}
